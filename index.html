<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>HDMarkDown - Professional Markdown Workspace</title>
    <link rel="icon" type="image/svg" href="https://icons.getbootstrap.com/assets/icons/markdown-fill.svg">
    
    <!-- Open Graph Meta Tags -->
    <meta property="og:title" content="HDMarkDown - Professional Markdown Workspace">
    <meta property="og:description" content="A modern Markdown Live Workspace built with local OPFS file storage, live preview, find & replace, and export capabilities.">
    <meta property="og:type" content="website">
    <meta property="og:image" content="https://icons.getbootstrap.com/assets/icons/markdown-fill.svg">
    <meta property="og:url" id="og-url" content="">

    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <!-- Highlight.js Deep Dark Theme -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/tokyo-night-dark.min.css" rel="stylesheet">
    
    <style>
      :root {
        --bg-pitch: #080a0f;
        --bg-surface: #10141d;
        --bg-surface-elevated: #181d2a;
        --border-color: #222938;
        --accent-color: #6366f1;
        --accent-hover: #4f46e5;
        --text-main: #f1f5f9;
        --text-muted: #94a3b8;
      }

      /* Global Scrollbar Styles */
      * {
        scrollbar-width: thin;
        scrollbar-color: var(--border-color) var(--bg-surface);
      }

      ::-webkit-scrollbar {
        width: 8px;
        height: 8px;
      }

      ::-webkit-scrollbar-track {
        background: var(--bg-pitch);
      }

      ::-webkit-scrollbar-thumb {
        background-color: var(--border-color);
        border-radius: 4px;
        border: 2px solid var(--bg-pitch);
      }

      ::-webkit-scrollbar-thumb:hover {
        background-color: var(--accent-color);
      }

      html, body {
        height: 100%;
        background-color: var(--bg-pitch);
        color: var(--text-main);
        overflow: hidden;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      }

      .app-container {
        display: flex;
        flex-direction: column;
        height: 100vh;
        height: 100dvh;
      }

      /* Global Button Centering Fix */
      .btn, .toolbar-btn {
        display: inline-flex !important;
        align-items: center !important;
        justify-content: center !important;
        vertical-align: middle;
        line-height: 1;
      }

      /* Navbar Customization */
      .app-header {
        background-color: var(--bg-surface);
        border-bottom: 1px solid var(--border-color);
      }

      #active-file-title {
        max-width: 180px;
        transition: all 0.2s ease;
      }

      #active-file-title:focus {
        background-color: var(--bg-surface-elevated) !important;
        box-shadow: 0 0 0 1px var(--accent-color);
      }

      /* Sidebar Styling & Collapsed State */
      .file-sidebar {
        background-color: var(--bg-surface);
        border-right: 1px solid var(--border-color);
        width: 260px;
        display: flex;
        flex-direction: column;
        transition: width 0.2s ease, padding 0.2s ease;
      }

      .file-sidebar.collapsed {
        width: 60px !important;
        padding: 0.5rem 0.25rem !important;
      }

      .file-sidebar.collapsed .sidebar-hide-on-collapse {
        display: none !important;
      }

      .file-sidebar.collapsed .sidebar-section {
        margin-bottom: 0.5rem !important;
      }
      
      .file-sidebar.collapsed .file-item {
        justify-content: center !important;
        padding: 0.5rem 0 !important;
      }

      .file-sidebar.collapsed .file-item span.text-truncate {
        max-width: 100% !important;
        display: flex !important;
        justify-content: center !important;
        align-items: center !important;
        width: 100% !important;
      }

      .file-sidebar.collapsed .file-item span.text-truncate i {
        margin-right: 0 !important;
      }

      .file-sidebar.collapsed .file-item-actions {
        display: none !important;
      }

      .file-item {
        padding: 0.4rem 0.6rem;
        border-radius: 6px;
        color: var(--text-muted);
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: space-between;
        transition: all 0.15s ease;
        font-size: 0.85rem;
        text-decoration: none;
      }

      .file-item:hover {
        background-color: var(--bg-surface-elevated);
        color: var(--text-main);
      }

      .file-item.active {
        background-color: rgba(99, 102, 241, 0.15);
        color: var(--accent-color);
        font-weight: 600;
      }

      .file-item .file-item-actions {
        opacity: 0;
        transition: opacity 0.15s ease;
        display: flex;
        gap: 0.3rem;
      }

      .file-item:hover .file-item-actions {
        opacity: 1;
      }

      .file-item-actions i {
        padding: 0.2rem;
        border-radius: 4px;
      }
      .file-item-actions i:hover {
        background-color: var(--border-color);
        color: var(--text-main) !important;
      }

      /* Mobile Formatting Toolbar */
      .toolbar-bar {
        background-color: var(--bg-surface);
        border-bottom: 1px solid var(--border-color);
        overflow-x: auto;
        overflow-y: hidden;
        white-space: nowrap;
        -webkit-overflow-scrolling: touch;
        touch-action: pan-x;
        scrollbar-width: thin;
        scrollbar-color: var(--border-color) transparent;
        display: flex;
        align-items: center;
        min-height: 48px;
        padding-top: 0.35rem !important;
        padding-bottom: 0.35rem !important;
      }

      .toolbar-bar>* {
        flex-shrink: 0;
      }

      .toolbar-btn {
        border: none;
        background: transparent;
        color: var(--text-muted);
        width: 36px;
        height: 36px;
        padding: 0;
        border-radius: 6px;
        transition: all 0.15s ease;
        font-size: 1rem;
      }

      .toolbar-btn:hover, .toolbar-btn.active {
        background-color: var(--bg-surface-elevated);
        color: var(--accent-color);
      }

      .find-replace-bar {
        background-color: var(--bg-surface-elevated);
        border-bottom: 1px solid var(--border-color);
      }

      /* Main Workspace Layout */
      .workspace {
        flex: 1;
        display: flex;
        overflow: hidden;
        position: relative;
      }

      .pane {
        height: 100%;
        overflow-y: auto;
      }

      .editor-pane {
        display: flex;
        flex-direction: column;
        background-color: var(--bg-pitch);
        width: 50%;
      }

      #editor {
        width: 100%;
        height: 100%;
        border: none;
        outline: none;
        resize: none;
        padding: 1rem;
        font-family: 'JetBrains Mono', 'Fira Code', 'SFMono-Regular', Consolas, monospace;
        font-size: 0.95rem;
        line-height: 1.6;
        background-color: transparent;
        color: var(--text-main);
      }

      .preview-pane {
        padding: 1.5rem;
        background-color: var(--bg-pitch);
        color: var(--text-main);
        flex: 1;
      }

      /* Resizable Splitter Handle */
      .resizer {
        width: 5px;
        background-color: var(--border-color);
        cursor: col-resize;
        transition: background-color 0.2s ease;
        z-index: 10;
        flex-shrink: 0;
      }

      .resizer:hover, .resizer.resizing {
        background-color: var(--accent-color);
      }

      /* Rendered Markdown Styling */
      .preview-pane h1, .preview-pane h2, .preview-pane h3 {
        border-bottom: 1px solid var(--border-color);
        padding-bottom: 0.3em;
        margin-top: 1.5em;
        margin-bottom: 1em;
      }

      /* Table responsive overflow */
      .preview-pane table {
        width: 100%;
        margin-bottom: 1rem;
        border-collapse: collapse;
        display: block;
        max-width: 100%;
        overflow-x: auto;
        -webkit-overflow-scrolling: touch;
      }

      .preview-pane table, .preview-pane th, .preview-pane td {
        border: 1px solid var(--border-color);
      }
      
      .preview-pane th, .preview-pane td {
        padding: 0.5rem 0.75rem;
      }

      .preview-pane th {
        background-color: var(--bg-surface);
      }

      .preview-pane blockquote {
        border-left: 4px solid var(--accent-color);
        padding-left: 1rem;
        margin-left: 0;
        color: var(--text-muted);
      }

      .preview-pane pre {
        max-width: 100%;
        overflow-x: auto;
      }
      
      .preview-pane pre code {
        border-radius: 8px;
        padding: 1.2rem !important;
        background-color: var(--bg-surface) !important;
      }

      .preview-pane img {
        max-width: 100%;
        height: auto;
        border-radius: 8px;
      }

      .video-container {
        position: relative;
        padding-bottom: 56.25%; /* 16:9 Aspect Ratio */
        height: 0;
        overflow: hidden;
        max-width: 100%;
        background: #000;
        margin: 1.5rem 0;
        border-radius: 8px;
        border: 1px solid var(--border-color);
      }

      .video-container iframe, .video-container video {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        border: 0;
        border-radius: 8px;
      }

      /* Responsive View Modes */
      .view-mode-split .editor-pane { display: flex; }
      .view-mode-split .preview-pane { display: block; }
      .view-mode-split .resizer { display: block; }
      .view-mode-edit .editor-pane { display: flex; width: 100% !important; }
      .view-mode-edit .preview-pane, .view-mode-edit .resizer { display: none !important; }
      .view-mode-preview .editor-pane, .view-mode-preview .resizer { display: none !important; }
      .view-mode-preview .preview-pane { display: block; width: 100% !important; }

      /* Table of Contents Offcanvas */
      .toc-link:hover {
        color: var(--accent-color) !important;
        background-color: var(--bg-surface-elevated);
        border-radius: 4px;
      }

      /* Desktop view rules */
      @media (min-width: 769px) {
        #mobileSidebar { display: none !important; }
      }

      /* Mobile Breakpoints & UI Tweaks */
      @media (max-width: 768px) {
        .desktop-sidebar { display: none !important; }
        .resizer { display: none !important; }
        .editor-pane { width: 100% !important; }
        .view-mode-split .editor-pane { display: flex; width: 100% !important; }
        .view-mode-split .preview-pane { display: none; }
        .preview-pane { padding: 1rem; }
      }

      @media (max-width: 576px) {
        .app-header { padding-left: 0.5rem !important; padding-right: 0.5rem !important; }
        #active-file-title { max-width: 110px !important; font-size: 0.85rem; }
        .toolbar-btn { width: 38px; height: 38px; font-size: 1.1rem; }
        #editor { padding: 0.85rem; font-size: 0.9rem; }
      }

      /* Print Media Styles */
      @media print {
        @page { margin: 1cm; }
        body {
          background-color: white !important;
          color: black !important;
          overflow: visible !important;
          height: auto !important;
        }
        .app-container, .workspace, .preview-pane {
          display: block !important;
          height: auto !important;
          overflow: visible !important;
          background: white !important;
          color: black !important;
        }
        .app-header, .toolbar-bar, .file-sidebar, #mobileSidebar, .editor-pane, .resizer, .find-replace-bar, footer {
          display: none !important;
        }
        .preview-pane {
          width: 100% !important;
          padding: 0 !important;
        }
        .preview-pane h1, .preview-pane h2, .preview-pane h3 {
          border-bottom-color: #ccc !important;
          page-break-after: avoid;
        }
        .preview-pane pre, .preview-pane blockquote {
          border: 1px solid #ccc;
          page-break-inside: avoid;
        }
        .preview-pane table, .preview-pane th, .preview-pane td {
          border-color: #ccc !important;
        }
        .preview-pane th {
          background-color: #f8f9fa !important;
        }
      }
    </style>
  </head>

  <body>
    <!-- Hidden File Input for JSON Import -->
    <input type="file" id="import-json-input" accept=".json" class="d-none">
    
    <div class="app-container">
      <!-- Navbar Header -->
      <header class="app-header px-2 px-sm-3 py-2">
        <div class="d-flex align-items-center justify-content-between gap-1 gap-sm-2">
          <!-- Left Section -->
          <div class="d-flex align-items-center gap-1 gap-sm-2 text-truncate me-auto">
            <!-- Unified Sidebar Toggle Button -->
            <button class="btn btn-sm btn-outline-secondary p-1 border-0 me-1" id="btn-toggle-sidebar" title="Toggle Sidebar">
              <i class="bi bi-folder2-open fs-5"></i>
            </button>
            <!-- App Brand -->
            <span class="fw-bold d-flex align-items-center gap-1 gap-sm-2 text-light flex-shrink-0">
              <i class="bi bi-markdown-fill" style="color: var(--accent-color);"></i>
              <span class="d-none d-sm-inline">HDMarkDown</span>
            </span>
            <span class="text-muted opacity-50 d-none d-sm-inline">/</span>
            <!-- Active File Name Input -->
            <input type="text" id="active-file-title" class="form-control form-control-sm border-0 bg-transparent text-light fw-medium px-1 px-sm-2" value="untitled.md" title="Rename active document">
          </div>

          <!-- Right Section: Tools, Modes & Data -->
          <div class="d-flex align-items-center gap-1 gap-sm-2 flex-shrink-0">
            <!-- Table of Contents Toggle -->
            <button class="btn btn-sm btn-outline-secondary px-2" type="button" data-bs-toggle="offcanvas" data-bs-target="#tocOffcanvas" title="Table of Contents">
              <i class="bi bi-list-nested"></i>
            </button>

            <!-- View Modes -->
            <div class="btn-group btn-group-sm" role="group" aria-label="View Modes">
              <button type="button" class="btn btn-outline-secondary px-2" id="btn-mode-edit" title="Editor Only">
                <i class="bi bi-pencil-fill"></i>
              </button>
              <button type="button" class="btn btn-outline-secondary px-2 d-none d-sm-inline-block" id="btn-mode-split" title="Toggle Split View">
                <i class="bi bi-columns"></i>
              </button>
              <button type="button" class="btn btn-outline-secondary px-2" id="btn-mode-preview" title="Preview Only">
                <i class="bi bi-eye-fill"></i>
              </button>
            </div>

            <!-- Import / Export / Print Dropdown -->
            <div class="dropdown">
              <button class="btn btn-sm btn-outline-secondary dropdown-toggle px-2" type="button" data-bs-toggle="dropdown" aria-expanded="false">
                <i class="bi bi-arrow-down-up"></i> <span class="d-none d-sm-inline ms-1">Data</span>
              </button>
              <ul class="dropdown-menu dropdown-menu-end bg-dark border-secondary shadow">
                <li><a class="dropdown-item text-light d-flex align-items-center gap-2" href="#" id="import-json-btn"><i class="bi bi-upload"></i> Import JSON</a></li>
                <li><a class="dropdown-item text-light d-flex align-items-center gap-2" href="#" id="export-json-btn"><i class="bi bi-filetype-json"></i> Export JSON</a></li>
                <li><hr class="dropdown-divider border-secondary"></li>
                <li><a class="dropdown-item text-light d-flex align-items-center gap-2" href="#" id="export-md"><i class="bi bi-filetype-md"></i> Download .md</a></li>
                <li><a class="dropdown-item text-light d-flex align-items-center gap-2" href="#" id="export-html"><i class="bi bi-filetype-html"></i> Download .html</a></li>
                <li><hr class="dropdown-divider border-secondary"></li>
                <li><a class="dropdown-item text-light d-flex align-items-center gap-2" href="#" onclick="window.print(); return false;"><i class="bi bi-printer"></i> Print Document</a></li>
              </ul>
            </div>
          </div>
        </div>
      </header>

      <!-- Markdown Formatting Toolbar -->
      <div class="toolbar-bar px-2 px-sm-3 py-1 gap-1 fs-6">
        <button class="toolbar-btn" id="btn-undo" onclick="undo()" title="Undo (Ctrl+Z)"><i class="bi bi-arrow-counterclockwise"></i></button>
        <button class="toolbar-btn" id="btn-redo" onclick="redo()" title="Redo (Ctrl+Y)"><i class="bi bi-arrow-clockwise"></i></button>
        <div class="vr mx-1 opacity-25"></div>
        <button class="toolbar-btn" onclick="toggleFindReplaceBar()" title="Find & Replace (Ctrl+F)"><i class="bi bi-search"></i></button>
        <div class="vr mx-1 opacity-25"></div>
        <button class="toolbar-btn" onclick="insertSyntax('bold')" title="Bold"><i class="bi bi-type-bold"></i></button>
        <button class="toolbar-btn" onclick="insertSyntax('italic')" title="Italic"><i class="bi bi-type-italic"></i></button>
        <button class="toolbar-btn" onclick="insertSyntax('strikethrough')" title="Strikethrough"><i class="bi bi-type-strikethrough"></i></button>
        <div class="vr mx-1 opacity-25"></div>
        <button class="toolbar-btn" onclick="insertSyntax('h1')" title="Heading 1"><i class="bi bi-type-h1"></i></button>
        <button class="toolbar-btn" onclick="insertSyntax('h2')" title="Heading 2"><i class="bi bi-type-h2"></i></button>
        <button class="toolbar-btn" onclick="insertSyntax('h3')" title="Heading 3"><i class="bi bi-type-h3"></i></button>
        <div class="vr mx-1 opacity-25"></div>
        <button class="toolbar-btn" onclick="insertSyntax('quote')" title="Quote"><i class="bi bi-quote"></i></button>
        <button class="toolbar-btn" onclick="insertSyntax('code')" title="Inline Code"><i class="bi bi-code"></i></button>
        <button class="toolbar-btn" onclick="insertSyntax('codeblock')" title="Code Block"><i class="bi bi-code-square"></i></button>
        <div class="vr mx-1 opacity-25"></div>
        <button class="toolbar-btn" onclick="insertSyntax('link')" title="Link"><i class="bi bi-link-45deg"></i></button>
        <button class="toolbar-btn" onclick="insertSyntax('image')" title="Image"><i class="bi bi-image"></i></button>
        <button class="toolbar-btn" onclick="insertSyntax('youtube')" title="YouTube Video"><i class="bi bi-youtube"></i></button>
        <button class="toolbar-btn" onclick="insertSyntax('table')" title="Table"><i class="bi bi-table"></i></button>
        <div class="vr mx-1 opacity-25"></div>
        <button class="toolbar-btn" onclick="insertSyntax('ul')" title="Unordered List"><i class="bi bi-list-ul"></i></button>
        <button class="toolbar-btn" onclick="insertSyntax('ol')" title="Ordered List"><i class="bi bi-list-ol"></i></button>
        <button class="toolbar-btn" onclick="insertSyntax('task')" title="Task List"><i class="bi bi-check2-square"></i></button>
      </div>

      <!-- Find & Replace Sub-Bar -->
      <div class="find-replace-bar px-2 px-sm-3 py-2 d-none" id="find-replace-bar">
        <div class="d-flex flex-wrap align-items-center gap-2">
          <div class="input-group input-group-sm flex-grow-1 flex-sm-grow-0" style="min-width: 120px; max-width: 220px;">
            <input type="text" id="find-input" class="form-control bg-dark text-light border-secondary" placeholder="Find text...">
          </div>
          <div class="input-group input-group-sm flex-grow-1 flex-sm-grow-0" style="min-width: 120px; max-width: 220px;">
            <input type="text" id="replace-input" class="form-control bg-dark text-light border-secondary" placeholder="Replace with...">
          </div>
          <div class="d-flex align-items-center gap-1">
            <button class="btn btn-sm btn-outline-secondary" id="btn-find-next" title="Find Next"><i class="bi bi-chevron-down"></i></button>
            <button class="btn btn-sm btn-outline-secondary" id="btn-find-prev" title="Find Previous"><i class="bi bi-chevron-up"></i></button>
            <button class="btn btn-sm btn-outline-primary" id="btn-replace">Replace</button>
            <button class="btn btn-sm btn-primary" id="btn-replace-all">All</button>
          </div>
          <div class="d-flex align-items-center ms-auto gap-2">
            <span class="small text-muted ms-1 ms-sm-2" id="find-counter">0 of 0</span>
            <button class="btn btn-sm btn-link text-muted p-0" id="btn-close-find" aria-label="Close find"><i class="bi bi-x-lg"></i></button>
          </div>
        </div>
      </div>

      <!-- Main Content Shell -->
      <div class="d-flex flex-grow-1 overflow-hidden">
        <!-- Desktop Sidebar Project Manager -->
        <aside class="file-sidebar desktop-sidebar pt-3 pb-2 px-2 overflow-y-auto" id="desktop-sidebar">
          <div class="d-flex align-items-center justify-content-between mb-3 px-2 sidebar-hide-on-collapse">
            <span class="small fw-bold text-uppercase text-muted">Workspace</span>
            <button class="btn btn-sm btn-primary py-1 px-2 fs-7" id="btn-new-file">
              <i class="bi bi-plus-lg"></i> <span class="ms-1">New</span>
            </button>
          </div>

          <!-- Dynamic File Sections Container -->
          <div id="sidebar-sections-desktop" class="d-flex flex-column">
            <!-- Content injected by JavaScript -->
          </div>
        </aside>

        <!-- Offcanvas Mobile Sidebar Manager -->
        <div class="offcanvas offcanvas-start bg-dark text-light" tabindex="-1" id="mobileSidebar">
          <div class="offcanvas-header border-bottom border-secondary">
            <h5 class="offcanvas-title">Workspace</h5>
            <button type="button" class="btn-close btn-close-white" data-bs-dismiss="offcanvas"></button>
          </div>
          <div class="offcanvas-body p-3">
            <button class="btn btn-primary w-100 mb-3" id="btn-new-file-mobile">
              <i class="bi bi-plus-lg me-1"></i> New Document
            </button>
            <div id="sidebar-sections-mobile" class="d-flex flex-column">
              <!-- Content injected by JavaScript -->
            </div>
          </div>
        </div>

        <!-- Table of Contents Offcanvas -->
        <div class="offcanvas offcanvas-end bg-dark text-light shadow" tabindex="-1" id="tocOffcanvas" style="width: 300px;">
          <div class="offcanvas-header border-bottom border-secondary">
            <h6 class="offcanvas-title text-uppercase text-muted fw-bold"><i class="bi bi-list-nested me-2"></i>Table of Contents</h6>
            <button type="button" class="btn-close btn-close-white" data-bs-dismiss="offcanvas"></button>
          </div>
          <div class="offcanvas-body">
            <div id="toc-list" class="d-flex flex-column small">
              <!-- TOC Links injected here -->
            </div>
          </div>
        </div>

        <!-- Main Workspace (Editor + Resizer + Live Preview) -->
        <main class="workspace view-mode-split" id="workspace">
          <div class="pane editor-pane" id="editor-pane">
            <textarea id="editor" placeholder="Write markdown here..." spellcheck="false"></textarea>
          </div>
          <div class="resizer" id="drag-resizer"></div>
          <div class="pane preview-pane" id="preview">
            <!-- Live rendered html -->
          </div>
        </main>
      </div>

      <!-- Footer Status Bar -->
      <footer class="app-header border-top px-3 py-1 fs-7 d-flex justify-content-between align-items-center text-muted small">
        <div>
          <span id="word-count">0 words</span> | <span id="char-count">0 characters</span>
        </div>
        <div class="d-flex align-items-center gap-1 text-warning opacity-75">
          <i class="bi bi-hdd"></i> <span>Local Storage</span>
        </div>
      </footer>
    </div>

    <!-- CDN Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/3.0.8/purify.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
    
    <script>
      // Configure DOMPurify to allow embedded frames and videos
      DOMPurify.addHook('uponSanitizeElement', (node, data) => {
        if (data.tagName === 'iframe') {
          const src = node.getAttribute('src') || '';
          if (!src.startsWith('https://www.youtube.com/') && !src.startsWith('https://www.youtube-nocookie.com/')) {
            node.parentNode.removeChild(node);
          }
        }
      });

      // OPFS Storage Controller
      class StorageEngine {
        static async getRoot() {
          if ('storage' in navigator && 'getDirectory' in navigator.storage) {
            return await navigator.storage.getDirectory();
          }
          throw new Error("OPFS is not supported in this browser environment.");
        }
        static async saveFile(filename, content) {
          try {
            const root = await this.getRoot();
            const handle = await root.getFileHandle(filename, { create: true });
            const writable = await handle.createWritable();
            await writable.write(content);
            await writable.close();
          } catch (err) {
            console.error("OPFS Save Error:", err);
          }
        }
        static async readFile(filename) {
          try {
            const root = await this.getRoot();
            const handle = await root.getFileHandle(filename);
            const file = await handle.getFile();
            return await file.text();
          } catch (err) {
            return null;
          }
        }
        static async listFiles() {
          try {
            const root = await this.getRoot();
            const files = [];
            for await (const entry of root.values()) {
              if (entry.kind === 'file' && entry.name !== '.metadata.json') {
                files.push(entry.name);
              }
            }
            return files;
          } catch (err) {
            return [];
          }
        }
        static async deleteFile(filename) {
          try {
            const root = await this.getRoot();
            await root.removeEntry(filename);
          } catch (err) {
            console.error("OPFS Delete Error:", err);
          }
        }
        static async saveMetadata(metadata) {
          await this.saveFile('.metadata.json', JSON.stringify(metadata));
        }
        static async readMetadata() {
          const content = await this.readFile('.metadata.json');
          if (!content) return {};
          try {
            return JSON.parse(content);
          } catch {
            return {};
          }
        }
      }

      // Default Starter Content
      const initialMarkdown = `# Welcome to HDMarkDown

A modern **Markdown Live Workspace** built with local **OPFS** file storage, **Find & Replace**, and **JSON Export**.

## New Features!
- **Table of Contents**: Click the list icon in the top right.
- **File Organization**: Sidebar now supports **Pinned** files and **Frequently Visited** tracking.
- **Inline Rename**: Click the edit icon in the sidebar to rename files without pop-ups!
- **Responsive Tables**: Tables now elegantly scroll horizontally on mobile.

| Feature | Supported | Description |
| :--- | :---: | :--- |
| Undo & Redo | ✅ | Full history tracking |
| Frequent Files | ✅ | Tracks your most used documents |
| Pinned Files | ✅ | Keep important files at the top |
| Mobile Friendly | ✅ | Fluid layout and responsive tables |

### Code Support
\`\`\`javascript
async function loadStorage() {
  const root = await navigator.storage.getDirectory();
  console.log("OPFS Loaded successfully!");
}
\`\`\`
`;

      // Global App State
      let activeFileName = localStorage.getItem('lastActiveFile') || 'welcome.md';
      let currentViewMode = 'split';
      let saveTimeout = null;
      let appMetadata = {};
      
      // Undo / Redo Stack
      const historyStack = [];
      let historyIndex = -1;
      const MAX_HISTORY = 100;
      let isUndoRedoAction = false;

      // DOM Elements
      const editor = document.getElementById('editor');
      const preview = document.getElementById('preview');
      const workspace = document.getElementById('workspace');
      const editorPane = document.getElementById('editor-pane');
      const resizer = document.getElementById('drag-resizer');
      const desktopSidebar = document.getElementById('desktop-sidebar');
      const activeFileTitle = document.getElementById('active-file-title');
      const wordCount = document.getElementById('word-count');
      const charCount = document.getElementById('char-count');
      const sectionsDesktop = document.getElementById('sidebar-sections-desktop');
      const sectionsMobile = document.getElementById('sidebar-sections-mobile');
      const tocList = document.getElementById('toc-list');

      marked.setOptions({
        gfm: true,
        breaks: true,
        highlight: function(code, lang) {
          const language = hljs.getLanguage(lang) ? lang : 'plaintext';
          return hljs.highlight(code, { language }).value;
        }
      });

      // Custom YouTube Embed Parser
      const youtubeExtension = {
        name: 'youtube',
        level: 'inline',
        start(src) { return src.indexOf('![youtube]('); },
        tokenizer(src, tokens) {
          const rule = /^!\[youtube\]\(([^)]+)\)/;
          const match = rule.exec(src);
          if (match) {
            return {
              type: 'youtube',
              raw: match[0],
              id: match[1].trim()
            };
          }
        },
        renderer(token) {
          let videoId = token.id;
          if (videoId.includes('v=')) videoId = videoId.split('v=')[1].split('&')[0];
          else if (videoId.includes('youtu.be/')) videoId = videoId.split('youtu.be/')[1].split('?')[0];
          return `<div class="video-container"><iframe src="https://www.youtube.com/embed/${videoId}" allowfullscreen></iframe></div>`;
        }
      };
      marked.use({ extensions: [youtubeExtension] });

      function pushHistory(val) {
        if (isUndoRedoAction) return;
        if (historyIndex >= 0 && historyStack[historyIndex] === val) return;
        if (historyIndex < historyStack.length - 1) historyStack.splice(historyIndex + 1);
        historyStack.push(val);
        if (historyStack.length > MAX_HISTORY) historyStack.shift();
        else historyIndex++;
      }

      function undo() {
        if (historyIndex > 0) {
          isUndoRedoAction = true;
          historyIndex--;
          editor.value = historyStack[historyIndex];
          renderMarkdown();
          isUndoRedoAction = false;
        }
      }

      function redo() {
        if (historyIndex < historyStack.length - 1) {
          isUndoRedoAction = true;
          historyIndex++;
          editor.value = historyStack[historyIndex];
          renderMarkdown();
          isUndoRedoAction = false;
        }
      }

      function renderMarkdown() {
        const markdownText = editor.value;
        const rawHTML = marked.parse(markdownText);
        const cleanHTML = DOMPurify.sanitize(rawHTML, {
          ADD_TAGS: ['iframe', 'video', 'source'],
          ADD_ATTR: ['allow', 'allowfullscreen', 'frameborder', 'src', 'controls', 'type', 'width']
        });
        preview.innerHTML = cleanHTML;
        
        // Code Highlights
        preview.querySelectorAll('pre code').forEach(block => hljs.highlightElement(block));
        
        // Generate Table of Contents & Headings
        generateTOC();
        updateMetrics(markdownText);
        
        // Debounce Auto-Save
        clearTimeout(saveTimeout);
        saveTimeout = setTimeout(async () => {
          await StorageEngine.saveFile(activeFileName, markdownText);
          if (appMetadata[activeFileName]) {
            appMetadata[activeFileName].modified = Date.now();
            await StorageEngine.saveMetadata(appMetadata);
          }
        }, 300);
      }

      function generateTOC() {
        const headings = preview.querySelectorAll('h1, h2, h3, h4, h5, h6');
        tocList.innerHTML = '';
        if (headings.length === 0) {
          tocList.innerHTML = '<div class="text-muted p-2">No headings found in the document.</div>';
          return;
        }
        headings.forEach((h, index) => {
          if (!h.id) h.id = 'heading-' + index;
          const link = document.createElement('a');
          link.href = '#' + h.id;
          link.textContent = h.textContent;
          const level = parseInt(h.tagName[1]);
          link.className = `toc-link d-block text-truncate text-decoration-none text-light py-1 px-2 mb-1`;
          // Indentation based on heading level
          link.style.paddingLeft = `${(level - 1) * 15 + 10}px`;
          
          if (level === 1) link.classList.add('fw-bold');
          else link.classList.add('opacity-75');

          link.addEventListener('click', (e) => {
            e.preventDefault();
            h.scrollIntoView({ behavior: 'smooth', block: 'start' });
            // Close mobile offcanvas if open
            const offcanvasEl = document.getElementById('tocOffcanvas');
            if (offcanvasEl) {
               const bsOffcanvas = bootstrap.Offcanvas.getInstance(offcanvasEl);
               if(bsOffcanvas && window.innerWidth < 992) bsOffcanvas.hide();
            }
          });
          tocList.appendChild(link);
        });
      }

      function updateMetrics(text) {
        const chars = text.length;
        const words = text.trim() ? text.trim().split(/\s+/).length : 0;
        charCount.textContent = `${chars} characters`;
        wordCount.textContent = `${words} words`;
      }

      async function refreshFileList() {
        let files = await StorageEngine.listFiles();
        appMetadata = await StorageEngine.readMetadata();
        
        // Ensure Welcome file exists
        if (!files.includes('welcome.md') || !appMetadata['welcome.md']) {
          await StorageEngine.saveFile('welcome.md', initialMarkdown);
          appMetadata['welcome.md'] = {
            id: `note_${Date.now()}`,
            title: 'Welcome',
            starred: true, // pin it by default
            visitCount: 1,
            created: Date.now(),
            modified: Date.now()
          };
          await StorageEngine.saveMetadata(appMetadata);
          files = await StorageEngine.listFiles();
        }

        // Categorize Files
        const pinnedFiles = files.filter(f => appMetadata[f]?.starred);
        
        // Top 5 Frequent Files (excluding pinned to avoid double top display, optional - here we show in both but separate visually)
        const frequentFiles = files.filter(f => !appMetadata[f]?.starred && (appMetadata[f]?.visitCount || 0) > 2)
                                   .sort((a,b) => (appMetadata[b]?.visitCount || 0) - (appMetadata[a]?.visitCount || 0))
                                   .slice(0, 5);
        
        // All Files Sorted by Modification Date
        const allFiles = [...files].sort((a,b) => (appMetadata[b]?.modified || 0) - (appMetadata[a]?.modified || 0));

        const renderSections = (container) => {
          container.innerHTML = '';
          
          // Helper to create sections
          const createSection = (title, icon, fileArray) => {
            if (fileArray.length === 0) return;
            const section = document.createElement('div');
            section.className = 'sidebar-section mb-3';
            section.innerHTML = `
              <div class="small fw-bold text-uppercase text-muted mb-1 sidebar-hide-on-collapse px-2"><i class="${icon} me-1"></i> ${title}</div>
              <div class="file-list d-flex flex-column gap-1"></div>
            `;
            const listContainer = section.querySelector('.file-list');
            fileArray.forEach(filename => appendFileItem(listContainer, filename));
            container.appendChild(section);
          };

          createSection('Pinned', 'bi bi-pin-angle-fill', pinnedFiles);
          createSection('Frequent', 'bi bi-graph-up', frequentFiles);
          createSection('All Files', 'bi bi-folder2-open', allFiles);
        };

        renderSections(sectionsDesktop);
        renderSections(sectionsMobile);
      }

      function appendFileItem(container, filename) {
        const item = document.createElement('div');
        const isPinned = appMetadata[filename]?.starred || false;
        item.className = `file-item ${filename === activeFileName ? 'active' : ''}`;
        
        item.innerHTML = `
          <span class="text-truncate flex-grow-1 filename-display d-flex align-items-center" title="${filename}">
            <i class="bi bi-file-earmark-text me-2"></i>
            <span class="sidebar-hide-on-collapse filename-text">${filename}</span>
          </span>
          <div class="file-item-actions sidebar-hide-on-collapse">
            <i class="bi ${isPinned ? 'bi-pin-fill text-warning' : 'bi-pin-angle text-muted'} pin-btn" title="Toggle Pin"></i>
            <i class="bi bi-pencil rename-btn text-muted" title="Rename inline"></i>
            <i class="bi bi-trash delete-btn text-danger" title="Delete"></i>
          </div>
        `;
        
        // Click to Open File
        item.querySelector('.filename-display').addEventListener('click', () => switchFile(filename));
        
        // Pin/Unpin Action
        item.querySelector('.pin-btn').addEventListener('click', async (e) => {
          e.stopPropagation();
          appMetadata[filename].starred = !appMetadata[filename].starred;
          await StorageEngine.saveMetadata(appMetadata);
          refreshFileList();
        });

        // Inline Rename Action
        item.querySelector('.rename-btn').addEventListener('click', (e) => {
          e.stopPropagation();
          triggerInlineRename(item, filename);
        });

        // Delete Action
        item.querySelector('.delete-btn').addEventListener('click', (e) => {
          e.stopPropagation();
          deleteFile(filename);
        });

        container.appendChild(item);
      }

      function triggerInlineRename(itemDiv, oldName) {
        const textSpan = itemDiv.querySelector('.filename-text');
        if (!textSpan) return;

        // Swap span for input
        textSpan.outerHTML = `<input type="text" class="form-control form-control-sm bg-dark text-light inline-rename-input border-primary p-0 px-1" style="height: 24px; font-size: 0.85rem;" value="${oldName}">`;
        const input = itemDiv.querySelector('.inline-rename-input');
        
        // Hide actions during rename
        itemDiv.querySelector('.file-item-actions').classList.add('d-none');
        
        input.focus();
        const extIndex = oldName.lastIndexOf('.');
        if (extIndex > 0) input.setSelectionRange(0, extIndex);
        else input.select();

        const commitRename = async () => {
          const newName = input.value.trim();
          if (newName && newName !== oldName) {
            await processFileRename(oldName, newName);
          } else {
            refreshFileList(); // abort rename UI
          }
        };

        input.addEventListener('click', e => e.stopPropagation());
        input.addEventListener('blur', commitRename);
        input.addEventListener('keydown', (ke) => {
          if (ke.key === 'Enter') input.blur();
          if (ke.key === 'Escape') refreshFileList();
        });
      }

      async function processFileRename(oldName, newNameInput) {
        let newName = newNameInput.trim();
        if (!newName.endsWith('.md')) newName += '.md';
        if (newName === oldName) return;

        const existingFiles = await StorageEngine.listFiles();
        if (existingFiles.includes(newName)) {
          // Add a timestamp to avoid overwrite collisions silently
          newName = newName.replace('.md', `_${Date.now().toString().slice(-4)}.md`);
        }

        const content = (oldName === activeFileName) ? editor.value : (await StorageEngine.readFile(oldName) || '');
        const meta = await StorageEngine.readMetadata();
        const activeMeta = meta[oldName] || {};

        await StorageEngine.deleteFile(oldName);
        delete meta[oldName];

        await StorageEngine.saveFile(newName, content);
        meta[newName] = {
          ...activeMeta,
          title: newName.replace(/\.md$/, ''),
          modified: Date.now()
        };
        await StorageEngine.saveMetadata(meta);
        appMetadata = meta;

        if (activeFileName === oldName) {
          activeFileName = newName;
          activeFileTitle.value = newName;
          localStorage.setItem('lastActiveFile', newName);
        }
        refreshFileList();
      }

      async function switchFile(filename) {
        activeFileName = filename;
        activeFileTitle.value = filename;
        localStorage.setItem('lastActiveFile', filename);
        
        let content = await StorageEngine.readFile(filename);
        editor.value = content !== null ? content : '';
        
        // Increment Visit Count
        if (appMetadata[filename]) {
          appMetadata[filename].visitCount = (appMetadata[filename].visitCount || 0) + 1;
          await StorageEngine.saveMetadata(appMetadata);
        }

        historyStack.length = 0;
        historyIndex = -1;
        pushHistory(editor.value);
        renderMarkdown();
        refreshFileList(); // Re-render to update active state & frequent list

        // Hide mobile offcanvas
        const mobileSidebarEl = document.getElementById('mobileSidebar');
        if (mobileSidebarEl) {
          const bsOffcanvas = bootstrap.Offcanvas.getInstance(mobileSidebarEl);
          if (bsOffcanvas) bsOffcanvas.hide();
        }
      }

      async function createNewFile() {
        // We will create a default name silently, user can rename inline easily
        let baseName = `Document_${Date.now().toString().slice(-4)}`;
        const formattedName = `${baseName}.md`;
        await StorageEngine.saveFile(formattedName, `# ${baseName}\n\nStart writing here...`);
        
        appMetadata[formattedName] = {
          id: `note_${Date.now()}`,
          title: baseName,
          starred: false,
          visitCount: 1,
          created: Date.now(),
          modified: Date.now()
        };
        await StorageEngine.saveMetadata(appMetadata);
        switchFile(formattedName);
      }

      async function deleteFile(filename) {
        if (confirm(`Delete "${filename}" permanently?`)) {
          await StorageEngine.deleteFile(filename);
          delete appMetadata[filename];
          await StorageEngine.saveMetadata(appMetadata);
          
          const files = await StorageEngine.listFiles();
          if (files.length > 0) switchFile(files[0]);
          else await createNewFile();
        }
      }

      // Header File Rename Logic
      activeFileTitle.addEventListener('change', async () => {
        let newTitle = activeFileTitle.value.trim();
        if (newTitle && newTitle !== activeFileName) {
          await processFileRename(activeFileName, newTitle);
        } else {
          activeFileTitle.value = activeFileName;
        }
      });

      // Split View Logic
      const btnEdit = document.getElementById('btn-mode-edit');
      const btnSplit = document.getElementById('btn-mode-split');
      const btnPreview = document.getElementById('btn-mode-preview');

      function setViewMode(mode) {
        currentViewMode = mode;
        workspace.className = `workspace view-mode-${mode}`;
        [btnEdit, btnSplit, btnPreview].forEach(btn => btn && btn.classList.remove('active'));
        if (mode === 'edit' && btnEdit) btnEdit.classList.add('active');
        if (mode === 'split' && btnSplit) btnSplit.classList.add('active');
        if (mode === 'preview' && btnPreview) btnPreview.classList.add('active');
      }

      if (btnEdit) btnEdit.addEventListener('click', () => setViewMode('edit'));
      if (btnSplit) btnSplit.addEventListener('click', () => setViewMode(currentViewMode === 'split' ? 'edit' : 'split'));
      if (btnPreview) btnPreview.addEventListener('click', () => setViewMode('preview'));

      // Resizer Engine
      let isResizing = false;
      resizer.addEventListener('mousedown', () => {
        isResizing = true;
        resizer.classList.add('resizing');
        document.body.style.cursor = 'col-resize';
        document.body.style.userSelect = 'none';
      });
      document.addEventListener('mousemove', (e) => {
        if (!isResizing) return;
        const workspaceRect = workspace.getBoundingClientRect();
        let percentage = ((e.clientX - workspaceRect.left) / workspaceRect.width) * 100;
        if (percentage < 15) percentage = 15;
        if (percentage > 85) percentage = 85;
        editorPane.style.width = `${percentage}%`;
      });
      document.addEventListener('mouseup', () => {
        if (isResizing) {
          isResizing = false;
          resizer.classList.remove('resizing');
          document.body.style.cursor = '';
          document.body.style.userSelect = '';
        }
      });

      // Synchronized Scrolling Engine
      let isEditingScroll = false, isPreviewScroll = false;
      editor.addEventListener('scroll', () => {
        if (isPreviewScroll) return;
        isEditingScroll = true;
        const percentage = editor.scrollTop / (editor.scrollHeight - editor.clientHeight);
        preview.scrollTop = percentage * (preview.scrollHeight - preview.clientHeight);
        setTimeout(() => isEditingScroll = false, 50);
      });
      preview.addEventListener('scroll', () => {
        if (isEditingScroll) return;
        isPreviewScroll = true;
        const percentage = preview.scrollTop / (preview.scrollHeight - preview.clientHeight);
        editor.scrollTop = percentage * (editor.scrollHeight - editor.clientHeight);
        setTimeout(() => isPreviewScroll = false, 50);
      });

      // Sidebar Toggle
      document.getElementById('btn-toggle-sidebar').addEventListener('click', () => {
        if (window.innerWidth < 769) {
          const bsOffcanvas = bootstrap.Offcanvas.getOrCreateInstance(document.getElementById('mobileSidebar'));
          bsOffcanvas.toggle();
        } else {
          desktopSidebar.classList.toggle('collapsed');
          localStorage.setItem('sidebar_collapsed', desktopSidebar.classList.contains('collapsed') ? 'true' : 'false');
        }
      });

      // Insert Syntax Helper
      function insertSyntax(type) {
        const start = editor.selectionStart;
        const end = editor.selectionEnd;
        const text = editor.value;
        const selected = text.substring(start, end);
        let before = '', after = '', placeholder = '';
        
        switch (type) {
          case 'bold': before = '**'; after = '**'; placeholder = 'bold text'; break;
          case 'italic': before = '*'; after = '*'; placeholder = 'italic text'; break;
          case 'strikethrough': before = '~~'; after = '~~'; placeholder = 'strikethrough text'; break;
          case 'h1': before = '# '; placeholder = 'Heading 1'; break;
          case 'h2': before = '## '; placeholder = 'Heading 2'; break;
          case 'h3': before = '### '; placeholder = 'Heading 3'; break;
          case 'quote': before = '> '; placeholder = 'Blockquote'; break;
          case 'code': before = '`'; after = '`'; placeholder = 'code'; break;
          case 'codeblock': before = '```javascript\n'; after = '\n```'; placeholder = '// code block'; break;
          case 'link': before = '['; after = '](https://example.com)'; placeholder = 'link text'; break;
          case 'image': before = '![Alt]('; after = ')'; placeholder = 'https://via.placeholder.com/150'; break;
          case 'youtube': before = '![youtube]('; after = ')'; placeholder = 'dQw4w9WgXcQ'; break;
          case 'table': before = '\n| Header 1 | Header 2 |\n| --- | --- |\n| Cell 1 | Cell 2 |\n'; break;
          case 'ul': before = '- '; placeholder = 'List item'; break;
          case 'ol': before = '1. '; placeholder = 'List item'; break;
          case 'task': before = '- [ ] '; placeholder = 'Task item'; break;
        }
        
        const insertion = selected || placeholder;
        editor.value = text.substring(0, start) + before + insertion + after + text.substring(end);
        editor.focus();
        editor.setSelectionRange(start + before.length, start + before.length + insertion.length);
        pushHistory(editor.value);
        renderMarkdown();
      }

      // Find & Replace System
      const findReplaceBar = document.getElementById('find-replace-bar');
      const findInput = document.getElementById('find-input');
      const replaceInput = document.getElementById('replace-input');
      const findCounter = document.getElementById('find-counter');
      let findMatches = [], currentMatchIndex = -1;

      function toggleFindReplaceBar() {
        findReplaceBar.classList.toggle('d-none');
        if (!findReplaceBar.classList.contains('d-none')) {
          findInput.focus();
          performFind();
        }
      }
      document.getElementById('btn-close-find').addEventListener('click', toggleFindReplaceBar);

      function performFind() {
        const query = findInput.value;
        findMatches = []; currentMatchIndex = -1;
        if (!query) { findCounter.textContent = '0 of 0'; return; }
        let pos = editor.value.indexOf(query);
        while (pos !== -1) {
          findMatches.push(pos);
          pos = editor.value.indexOf(query, pos + query.length);
        }
        if (findMatches.length > 0) {
          currentMatchIndex = 0;
          selectMatch();
        }
        findCounter.textContent = findMatches.length > 0 ? `${currentMatchIndex + 1} of ${findMatches.length}` : '0 of 0';
      }

      function selectMatch() {
        if (currentMatchIndex >= 0 && currentMatchIndex < findMatches.length) {
          const start = findMatches[currentMatchIndex];
          editor.focus();
          editor.setSelectionRange(start, start + findInput.value.length);
          findCounter.textContent = `${currentMatchIndex + 1} of ${findMatches.length}`;
        }
      }

      findInput.addEventListener('input', performFind);
      document.getElementById('btn-find-next').addEventListener('click', () => {
        if (findMatches.length === 0) return;
        currentMatchIndex = (currentMatchIndex + 1) % findMatches.length;
        selectMatch();
      });
      document.getElementById('btn-find-prev').addEventListener('click', () => {
        if (findMatches.length === 0) return;
        currentMatchIndex = (currentMatchIndex - 1 + findMatches.length) % findMatches.length;
        selectMatch();
      });
      document.getElementById('btn-replace').addEventListener('click', () => {
        if (currentMatchIndex === -1 || findMatches.length === 0) return;
        const start = findMatches[currentMatchIndex];
        const queryLen = findInput.value.length;
        editor.value = editor.value.substring(0, start) + replaceInput.value + editor.value.substring(start + queryLen);
        pushHistory(editor.value);
        renderMarkdown();
        performFind();
      });
      document.getElementById('btn-replace-all').addEventListener('click', () => {
        const query = findInput.value;
        if (!query) return;
        editor.value = editor.value.replaceAll(query, replaceInput.value);
        pushHistory(editor.value);
        renderMarkdown();
        performFind();
      });

      // Data Imports and Exports
      function triggerDownload(filename, content, type) {
        const blob = new Blob([content], { type });
        const link = document.createElement('a');
        link.href = URL.createObjectURL(blob);
        link.download = filename;
        link.click();
        URL.revokeObjectURL(link.href);
      }

      document.getElementById('export-json-btn').addEventListener('click', async (e) => {
        e.preventDefault();
        const files = await StorageEngine.listFiles();
        const exportList = [];
        for (const file of files) {
          const content = await StorageEngine.readFile(file);
          const info = appMetadata[file] || {};
          exportList.push({
            id: info.id || `note_${Date.now()}_${Math.random().toString(36).substring(2, 6)}`,
            title: file.replace(/\.md$/, ''),
            content: content || '',
            starred: info.starred || false,
            visitCount: info.visitCount || 0,
            created: info.created || Date.now(),
            modified: info.modified || Date.now()
          });
        }
        triggerDownload('hdmarkdown_backup.json', JSON.stringify(exportList, null, 2), 'application/json');
      });

      const importFileInput = document.getElementById('import-json-input');
      document.getElementById('import-json-btn').addEventListener('click', e => {
        e.preventDefault();
        importFileInput.click();
      });
      importFileInput.addEventListener('change', async (e) => {
        const file = e.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = async (event) => {
          try {
            const notes = JSON.parse(event.target.result);
            let lastFilename = activeFileName;
            for (const item of notes) {
              const rawTitle = item.title || 'Untitled';
              let safeFilename = rawTitle.replace(/[^a-zA-Z0-9_-]/g, '_') + '.md';
              let counter = 1;
              const existingFiles = await StorageEngine.listFiles();
              while (existingFiles.includes(safeFilename)) {
                safeFilename = `${rawTitle.replace(/[^a-zA-Z0-9_-]/g, '_')}_${counter}.md`;
                counter++;
              }
              await StorageEngine.saveFile(safeFilename, item.content || '');
              appMetadata[safeFilename] = {
                id: item.id || `note_${Date.now()}`,
                title: item.title || 'Untitled',
                starred: !!item.starred,
                visitCount: item.visitCount || 0,
                created: item.created || Date.now(),
                modified: item.modified || Date.now()
              };
              lastFilename = safeFilename;
            }
            await StorageEngine.saveMetadata(appMetadata);
            await refreshFileList();
            await switchFile(lastFilename);
          } catch (err) {
            console.error("Import Error", err);
          }
          importFileInput.value = '';
        };
        reader.readAsText(file);
      });

      document.getElementById('export-md').addEventListener('click', e => {
        e.preventDefault();
        triggerDownload(activeFileName, editor.value, 'text/markdown');
      });

      document.getElementById('export-html').addEventListener('click', e => {
        e.preventDefault();
        const rawTitle = activeFileName.replace(/\.md$/, '');
        const fullHTML = `<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>${rawTitle}</title>
  <style>
    body { font-family: sans-serif; line-height: 1.6; max-width: 800px; margin: 0 auto; padding: 2rem; background: #080a0f; color: #f1f5f9; }
    pre { background: #10141d; padding: 1rem; border-radius: 6px; overflow-x: auto; }
    blockquote { border-left: 4px solid #6366f1; margin: 0; padding-left: 1rem; color: #94a3b8; }
    table { border-collapse: collapse; width: 100%; display: block; overflow-x: auto; }
    th, td { border: 1px solid #222938; padding: 8px; }
    .video-container { position: relative; padding-bottom: 56.25%; height: 0; overflow: hidden; margin: 1.5rem 0; border-radius: 8px; }
    .video-container iframe { position: absolute; top: 0; left: 0; width: 100%; height: 100%; border: 0; }
  </style>
</head>
<body>
  ${preview.innerHTML}
</body>
</html>`;
        triggerDownload(`${rawTitle}.html`, fullHTML, 'text/html');
      });

      // Keyboard Shortcuts & Input
      window.addEventListener('keydown', (e) => {
        if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'z') {
          e.preventDefault();
          e.shiftKey ? redo() : undo();
        } else if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'y') {
          e.preventDefault();
          redo();
        } else if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'f') {
          e.preventDefault();
          toggleFindReplaceBar();
        }
      });

      editor.addEventListener('input', () => {
        pushHistory(editor.value);
        renderMarkdown();
      });

      document.getElementById('btn-new-file').addEventListener('click', createNewFile);
      document.getElementById('btn-new-file-mobile').addEventListener('click', createNewFile);

      // Startup
      window.addEventListener('DOMContentLoaded', async () => {
        if (localStorage.getItem('sidebar_collapsed') === 'true') {
          desktopSidebar.classList.add('collapsed');
        }
        setViewMode('split');
        await refreshFileList();
        
        const availableFiles = await StorageEngine.listFiles();
        if (!availableFiles.includes(activeFileName)) {
          activeFileName = 'welcome.md';
        }
        
        await switchFile(activeFileName);
      });
    </script>
